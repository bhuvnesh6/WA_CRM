<title>WaCRM – WhatsApp Business CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#f5f6f8;--bg-surface:#fff;--bg-card:#fff;--bg-hover:#f0f3fa;--nav:#0e1a30;
  --border:#e3e7ee;--accent-1:#2557d6;--accent-2:#1b3f9f;--accent-3:#3b82f6;
  --accent-grad:#2557d6;--accent-grad-soft:#eaf0fd;
  --text-h:#0f1a2e;--text-b:#4a566b;--text-dim:#8793a8;
  --green:#12875a;--red:#d92d20;--yellow:#3b82f6;--purple:#5b34c4;--orange:#1d4ed8;
  --sidebar-w:240px;--topbar-h:60px;--radius:12px;--radius-sm:8px;--gap:16px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 8px 24px rgba(16,24,40,.14);--shadow-glow:0 2px 6px rgba(37,87,214,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 Inter,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg-base);color:var(--text-b);height:100vh;display:flex;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text-h);background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:vertical;min-height:70px}
b{color:var(--text-h)} small{color:var(--text-dim);font-size:12px}
aside{width:var(--sidebar-w);background:var(--nav);color:#c5cee0;display:flex;flex-direction:column;padding:16px 12px;gap:4px;flex-shrink:0;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;color:#fff;padding:2px 6px 14px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent-1);color:#fff;display:grid;place-items:center;font-style:normal}
.sl{font-size:12px;color:#8e9bb5;padding:0 6px 4px}
.ns{background:#17264a;border:1px solid #26365c;color:#fff;font-size:13px}
.lbl{font-size:12px;color:#7f8ca8;padding:16px 8px 4px;font-weight:600}
aside nav button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-weight:500;text-align:left;color:#c5cee0}
aside nav button svg{flex-shrink:0}aside nav button span{flex:1}
aside nav button:hover{background:rgba(255,255,255,.07);color:#fff}
aside nav button.on{background:var(--accent-1);color:#fff}
aside nav button.on .bd{background:#fff;color:var(--accent-1)}
.demo{font-size:12px;color:#7f8ca8;padding:8px 6px;line-height:1.4}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-1);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.av.lg{width:42px;height:42px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.bd{background:var(--accent-1);color:#fff;border-radius:99px;font-size:11px;font-style:normal;padding:1px 7px;font-weight:600}
.sp{flex:1}
.ib{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--text-b);border:1px solid transparent;flex-shrink:0}
.ib:hover{background:var(--bg-hover);color:var(--text-h)}.ib.red:hover{background:#fee4e2;color:var(--red)}
.mnu{display:none}
/* leads */
.fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:var(--gap)}
.fb select,.fb input{width:auto}.fb .fq{flex:1 1 240px}.fr{display:none;gap:6px;align-items:center}
.who{display:flex;gap:10px;align-items:center}td small{display:block}
th{background:#fafbfc;white-space:nowrap}tbody tr:hover{background:#fafbfd}
.act{text-align:right;white-space:nowrap}.act>*{vertical-align:middle}
.st{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.s-New{background:#e0ebff;color:#1b45b5}.s-Contacted{background:#fef3c7;color:#8a5200}.s-Qualified{background:#ece7fd;color:#5b34c4}.s-Won{background:#d9f5e7;color:#0b6b45}.s-Lost{background:#eceff3;color:#5b6577}
.tf{padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-dim)}
.empty{text-align:center;padding:48px 16px}.empty p{margin:6px 0 14px}
.ov.dro{place-items:stretch end;padding:0}
.dr{background:#fff;width:min(500px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.dh{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}.dh .cm{flex:1}
.dbody{padding:18px 20px;overflow:auto;flex:1}.dbody h3{font-size:13.5px;color:var(--text-h);margin:18px 0 8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kv small{display:block;margin-bottom:2px}.kv span{color:var(--text-h);font-weight:500;word-break:break-word}
.rs{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px}
.rh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.rh small{margin-left:auto}
.rt{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 9px;background:#eceff3;color:#4a566b}.rt.f{background:#e0ebff;color:#1b45b5}.rt.b{background:#fef3c7;color:#8a5200}
.fv>div{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--border)}.fv dt{color:var(--text-dim);font-size:12.5px}.fv dd{color:var(--text-h);word-break:break-word}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:var(--topbar-h);background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.top h1{font-size:18px;color:var(--text-h)}
.chip{background:var(--accent-grad-soft);color:var(--accent-2);border-radius:99px;padding:4px 12px;font-weight:600;font-size:12.5px}
#view{flex:1;overflow:auto;padding:var(--gap)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px}
.btn{background:var(--accent-grad);color:#fff;border-radius:var(--radius-sm);padding:8px 16px;font-weight:600;box-shadow:var(--shadow-sm)}
.btn:hover{box-shadow:var(--shadow-glow)}
.btn.ghost{background:#fff;color:var(--accent-1);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{background:var(--bg-hover)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.del{background:#fff;color:var(--red);border:1px solid rgba(220,38,38,.25);box-shadow:none}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600;background:var(--bg-hover);color:var(--accent-1)}
.pill.ok{background:rgba(8,145,178,.12);color:var(--green)} .pill.wait{background:#fef3c7;color:#8a5200}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:var(--gap)}
.grid .card{cursor:pointer;transition:.15s}.grid .card:hover{box-shadow:var(--shadow-md)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--text-h);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* inbox */
.inbox{display:grid;grid-template-columns:310px 1fr;gap:var(--gap);height:calc(100vh - var(--topbar-h) - 32px)}
.inbox .card{padding:0;display:flex;flex-direction:column;overflow:hidden}
.ch{padding:12px;border-bottom:1px solid var(--border)}
#cl{overflow:auto;flex:1}
.ci{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.ci:hover{background:var(--bg-hover)}.ci.on{background:var(--accent-grad-soft)}
.cm{flex:1;min-width:0}.cm span{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chh{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.chh>div:nth-child(2){flex:1}.chh small{display:block}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--bg-base)}
.b{max-width:68%;padding:8px 12px;border-radius:12px;box-shadow:var(--shadow-sm);font-size:13.5px}
.b.in{background:#fff;align-self:flex-start;border-top-left-radius:3px}
.b.out{background:#d6e6fd;align-self:flex-end;border-top-right-radius:3px}
.b p{color:var(--text-h);margin:2px 0}.b em{display:block;text-align:right;font-size:10.5px;color:var(--text-dim);font-style:normal}
.mb{display:block;width:100%;text-align:center;padding:7px;margin-top:5px;border-top:1px solid var(--border);color:var(--accent-1);font-weight:600;font-size:13px}
.mb:hover{background:var(--bg-hover)}
.sys{align-self:center;background:#fff;border:1px dashed var(--accent-3);color:var(--accent-2);border-radius:99px;padding:3px 12px;font-size:12px}
.comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
.comp select{width:150px;flex-shrink:0}
.sim{display:flex;gap:8px;padding:8px 12px;background:var(--bg-hover);align-items:center;font-size:12px}
/* flows */
.split{display:grid;grid-template-columns:280px 1fr;gap:var(--gap);align-items:start}
.fi{position:relative;padding:11px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent}
.fi:hover{background:var(--bg-hover)}.fi.on{background:var(--accent-grad-soft);border-color:var(--accent-1)}
.fi small{display:block}
.sw{position:absolute;right:10px;top:12px}.sw input{display:none}
.sw span{display:block;width:34px;height:19px;border-radius:99px;background:var(--text-dim);position:relative;transition:.15s}
.sw span:after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--accent-1)}.sw input:checked+span:after{left:17px}
.node{background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent-1);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow-sm);max-width:560px;margin:0 auto}
.node.t{border-left-color:var(--accent-3);background:linear-gradient(#fff,#f4f9ff)}
.node h4{display:flex;justify-content:space-between;align-items:center;color:var(--text-h);margin-bottom:8px;font-size:13.5px}
.cn{width:2px;height:22px;background:var(--accent-1);margin:0 auto;opacity:.4}
.adds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(11,30,61,.45);display:grid;place-items:center;z-index:9;padding:16px}
.md{background:#fff;border-radius:var(--radius);width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.mh,.mf{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:10px}
.mh{border-bottom:1px solid var(--border)}.mf{border-top:1px solid var(--border);justify-content:flex-end}
.mbd{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:6px 20px 16px;overflow:auto}
.mbd.one{grid-template-columns:1fr}
.phone{background:var(--bg-base);border-radius:18px;padding:16px;min-height:280px;position:sticky;top:0;border:1px solid var(--border)}
.br{display:flex;gap:6px;margin-top:6px}
pre{background:#0b1e3d;color:#bfdbfe;border-radius:var(--radius-sm);padding:10px;font-size:11.5px;overflow:auto;margin-top:6px}
details{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;margin-top:8px}summary{cursor:pointer;color:var(--text-h);font-weight:600;font-size:13px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--text-h);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:20}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:var(--gap)}
.stats b{font-size:20px;display:block}
table{width:100%;border-collapse:collapse}th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--text-dim);font-weight:600}tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:var(--gap);flex-wrap:wrap}.tabs button{padding:8px 16px;border-radius:99px;font-weight:600;background:#fff;border:1px solid var(--border)}.tabs button:hover{background:var(--bg-hover)}.tabs button.on{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-glow)}
@media(max-width:860px){aside{position:fixed;inset:0 auto 0 0;z-index:15;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.mnu{display:inline-grid}.top{padding:0 14px}.inbox,.split,.mbd,.two{grid-template-columns:1fr}.inbox{height:auto}.stats{grid-template-columns:1fr 1fr}}
</style></head>

function sendTxt(){const i=$('#mi'),t=i.value.trim();if(!t)return;push(conv(),{d:'out',text:t,t:tm()})}
function sendTpl(id){if(!id)return;const c=conv();push(c,tplMsg(D().tpls.find(t=>t.id===id),c))}
function sendForm(id){if(!id)return;const f=D().forms.find(x=>x.id===id);push(conv(),{d:'out',text:'Please fill in this form: '+f.name,btns:[{type:'FORM',text:'Open form',fid:id}],t:tm()})}
function addIn(c,text,kind,extra){push(c,{d:'in',text,t:tm()});captureLead(c,text,kind,extra);
 log('messages',{contacts:[{profile:{name:c.name},wa_id:c.phone.replace(/\D/g,'')}],messages:[kind==='button'?{from:c.phone.replace(/\D/g,''),type:'button',button:{text,payload:text}}:{from:c.phone.replace(/\D/g,''),type:'text',text:{body:text}}]})}
function simIn(){const i=$('#si'),t=i.value.trim();if(!t)return;const c=conv();addIn(c,t,'text');fire('keyword',t,c)}
function clickBtn(i,j){const c=conv(),b=c.msgs[i].btns[j];
 if(b.type==='URL')return toast('Opens '+b.url);
 if(b.type==='FORM')return fillForm(b.fid);
 addIn(c,b.text,'button');fire('button',b.text,c)}
function fillForm(fid){const f=D().forms.find(x=>x.id===fid);
 modal(`<div class="mh"><b>${esc(f.name)}</b><button onclick="closeM()">✕</button></div><div class="mbd one"><div>${f.fields.map((x,i)=>`<label class="f">${esc(x.label)}</label>${x.type==='select'?`<select id="ff${i}">${CITIES.map(c=>`<option>${c}</option>`).join('')}</select>`:`<input id="ff${i}" type="${x.type==='phone'?'tel':x.type}">`}`).join('')}</div></div><div class="mf"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="submitForm('${fid}')">Submit as customer</button></div>`)}
function submitForm(fid){const f=D().forms.find(x=>x.id===fid),c=conv();
 const fields=f.fields.map((x,i)=>({label:x.label,value:$('#ff'+i).value||'–'})),txt='Form submitted – '+fields.map(x=>x.label+': '+x.value).join(', ');closeM();f.subs++;addIn(c,txt,'form',{form:f.name,fields});
 log('messages',{messages:[{type:'interactive',interactive:{type:'nfm_reply',nfm_reply:{name:f.name}}}]});fire('form',fid,c)}
function fire(kind,val,c,id=cur){D(id).flows.filter(f=>f.on&&f.trg.type===kind&&(kind==='form'?(f.trg.value==='any'||f.trg.value===val):kind==='button'?f.trg.value.toLowerCase()===val.toLowerCase():val.toLowerCase().includes(f.trg.value.toLowerCase()))).forEach(f=>run(f,c,id))}
function run(f,c,id){f.runs++;push(c,{d:'sys',text:'⚡ Automation “'+f.name+'” started'});
 f.steps.forEach((s,i)=>setTimeout(()=>{if(!DATA[id])return;const d=D(id);
  if(s.type==='template'){const t=d.tpls.find(x=>x.id===s.v);if(t)push(c,tplMsg(t,c))}
  else if(s.type==='text')push(c,{d:'out',text:s.v,t:tm()});
  else if(s.type==='form'){const fm=d.forms.find(x=>x.id===s.v);if(fm)push(c,{d:'out',text:'Please fill in this form: '+fm.name,btns:[{type:'FORM',text:'Open form',fid:fm.id}],t:tm()})}
  else if(s.type==='tag'){c.tag=s.v;const l=findLead(c,id);if(l)l.tag=s.v;push(c,{d:'sys',text:'Tag added: '+s.v})}
  else if(s.type==='delay')push(c,{d:'sys',text:'⏱ Waited '+s.v+' min (skipped in demo)'});
  else if(s.type==='assign'){const l=findLead(c,id);if(l)l.assigned=s.v;push(c,{d:'sys',text:'Chat assigned to '+s.v})}
 },(i+1)*700))}

/* ---------- templates ---------- */
function vTpl(v){const d=D();
 v.innerHTML=`<div class="row"><div><b>${d.tpls.length} templates</b><br><small>Create templates, submit to Meta for approval, then use them in chats and automations.</small></div><button class="btn" onclick="editTpl()">+ New template</button></div><div class="grid">${d.tpls.map(t=>`<div class="card" onclick="editTpl('${t.id}')"><div class="row"><b>${esc(t.name)}</b><span class="pill ${t.status==='APPROVED'?'ok':'wait'}">${t.status}</span></div><small>${t.cat} · ${t.lang}</small><p style="margin:10px 0;color:var(--text-h)">${esc(t.body.slice(0,110))}</p>${t.btns.map(b=>`<span class="pill" style="margin-right:4px">${esc(b.text)}</span>`).join('')}</div>`).join('')}</div>`}
function editTpl(id){const t=id?D().tpls.find(x=>x.id===id):null;
 T=t?JSON.parse(JSON.stringify(t)):{id:uid(),name:'',cat:'MARKETING',lang:'en_IN',header:'',body:'',footer:'',btns:[],status:'DRAFT',isNew:1};
 modal(`<div class="mh"><b>${t?'Edit':'Create'} template</b><button onclick="closeM()">✕</button></div><div class="mbd"><div>
 <label class="f">Template name</label><input value="${esc(T.name)}" placeholder="order_update" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'_');T.name=this.value">
 <div class="two"><div><label class="f">Category</label><select onchange="T.cat=this.value">${['MARKETING','UTILITY','AUTHENTICATION'].map(x=>`<option ${x===T.cat?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><label class="f">Language</label><select onchange="T.lang=this.value">${['en_IN','hi','en_US','ta','te','mr'].map(x=>`<option ${x===T.lang?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <label class="f">Header (optional)</label><input value="${esc(T.header)}" oninput="T.header=this.value;pv()">
 <label class="f">Body – use {{1}} for the customer's first name</label><textarea oninput="T.body=this.value;pv()">${esc(T.body)}</textarea>
 <label class="f">Footer (optional)</label><input value="${esc(T.footer)}" oninput="T.footer=this.value;pv()">
 <label class="f">Buttons (max 3)</label><div id="bl"></div><div class="br"><button class="btn ghost sm" onclick="addB('QUICK')">+ Quick reply</button><button class="btn ghost sm" onclick="addB('URL')">+ Website link</button></div>
 </div><div><div class="phone" id="pv"></div></div></div>
 <div class="mf">${t?'<button class="btn del" style="margin-right:auto" onclick="delTpl()">Delete</button>':''}<button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveTpl()">Submit for approval</button></div>`);pv();bl()}
function pv(){$('#pv').innerHTML=`<div class="b out" style="max-width:100%;align-self:auto">${T.header?`<b>${esc(T.header)}</b>`:''}<p>${esc(T.body||'Your message preview appears here').replace(/\{\{1\}\}/g,'Aarav').replace(/\n/g,'<br>')}</p>${T.footer?`<small>${esc(T.footer)}</small>`:''}<em>${tm()}</em>${T.btns.map(b=>`<div class="mb">${b.type==='URL'?'↗':'↩'} ${esc(b.text||'Button')}</div>`).join('')}</div>`}
function bl(){$('#bl').innerHTML=T.btns.map((b,i)=>`<div class="br"><input value="${esc(b.text)}" placeholder="${b.type==='URL'?'Label':'Reply text'}" oninput="T.btns[${i}].text=this.value;pv()">${b.type==='URL'?`<input value="${esc(b.url||'')}" placeholder="https://" oninput="T.btns[${i}].url=this.value">`:''}<button class="btn del sm" onclick="T.btns.splice(${i},1);bl();pv()">✕</button></div>`).join('')}
function addB(type){if(T.btns.length>=3)return toast('WhatsApp allows up to 3 buttons');T.btns.push({type,text:'',url:''});bl();pv()}
function saveTpl(){if(!T.name||!T.body)return toast('Name and body are required');T.btns=T.btns.filter(b=>b.text);const d=D(),id=cur;T.status='PENDING';delete T.isNew;
 const i=d.tpls.findIndex(x=>x.id===T.id);i<0?d.tpls.push(T):d.tpls[i]=T;const tid=T.id;closeM();render();toast('Submitted to Meta for review');
 setTimeout(()=>{const t=D(id)?.tpls.find(x=>x.id===tid);if(t){t.status='APPROVED';log('message_template_status_update',{event:'APPROVED',message_template_name:t.name,message_template_language:t.lang},id);if(view==='tpl'&&cur===id)render();toast('Template “'+t.name+'” approved')}},2500)}

function delTpl(){D().tpls=D().tpls.filter(x=>x.id!==T.id);closeM();render();toast('Template deleted')}

/* ---------- forms ---------- */
function vForms(v){const d=D();
 v.innerHTML=`<div class="row"><div><b>${d.forms.length} forms</b><br><small>Send a form from any chat. Customer answers can start an automation.</small></div><button class="btn" onclick="editForm()">+ New form</button></div><div class="grid">${d.forms.map(f=>`<div class="card" onclick="editForm('${f.id}')"><div class="row"><b>${esc(f.name)}</b><span class="pill">${f.subs} submissions</span></div><small>${f.fields.length} fields</small><p style="margin-top:8px">${f.fields.map(x=>esc(x.label)).join(' · ')}</p></div>`).join('')}</div>`}
function editForm(id){const f=id?D().forms.find(x=>x.id===id):null;F=f?JSON.parse(JSON.stringify(f)):{id:uid(),name:'',fields:[{label:'Full name',type:'text'}],subs:0,isNew:1};
 modal(`<div class="mh"><b>${f?'Edit':'Create'} form</b><button onclick="closeM()">✕</button></div><div class="mbd"><div><label class="f">Form name</label><input value="${esc(F.name)}" oninput="F.name=this.value"><label class="f">Fields</label><div id="fl"></div><div class="br"><button class="btn ghost sm" onclick="F.fields.push({label:'',type:'text'});fld()">+ Add field</button></div></div><div><div class="phone" id="fp"></div></div></div><div class="mf">${f?`<button class="btn del" style="margin-right:auto" onclick="delForm()">Delete</button>`:''}<button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveForm()">Save form</button></div>`);fld()}
function fld(){$('#fl').innerHTML=F.fields.map((x,i)=>`<div class="br"><input value="${esc(x.label)}" placeholder="Field label" oninput="F.fields[${i}].label=this.value;fld2()"><select style="width:120px" onchange="F.fields[${i}].type=this.value;fld2()">${['text','email','phone','number','date','select'].map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select><button class="btn del sm" onclick="F.fields.splice(${i},1);fld()">✕</button></div>`).join('');fld2()}
function fld2(){$('#fp').innerHTML=`<b>${esc(F.name||'Form preview')}</b>`+F.fields.map(x=>`<label class="f">${esc(x.label||'Untitled')}</label><input disabled placeholder="${x.type==='select'?'Choose city…':x.type}">`).join('')}
function saveForm(){if(!F.name)return toast('Give the form a name');F.fields=F.fields.filter(x=>x.label);const d=D(),i=d.forms.findIndex(x=>x.id===F.id);delete F.isNew;i<0?d.forms.push(F):d.forms[i]=F;closeM();render();toast('Form saved')}
function delForm(){D().forms=D().forms.filter(x=>x.id!==F.id);closeM();render();toast('Form deleted')}

/* ---------- automation ---------- */
const STEPS={template:'Send template',text:'Send message',form:'Send form',tag:'Add tag',delay:'Wait',assign:'Assign agent'};
const trgLabel=f=>({button:'Button click',keyword:'Keyword',form:'Form submitted'})[f.trg.type]+(f.trg.type==='form'?'':': '+f.trg.value);
const opts=(arr,sel,k='id',l='name')=>arr.map(x=>`<option value="${x[k]}" ${x[k]===sel?'selected':''}>${esc(x[l])}</option>`).join('');
function vFlows(v){const d=D();let f=fl()||d.flows[0];S.flow=f?.id;
 v.innerHTML=`<div class="split"><div class="card"><div class="row"><b>Flows</b><button class="btn sm" onclick="newFlow()">+ New</button></div>${d.flows.map(x=>`<div class="fi ${x===f?'on':''}" onclick="S.flow='${x.id}';render()"><b>${esc(x.name)}</b><small>${trgLabel(x)}</small><small>${x.steps.length} steps · ${x.runs} runs</small><label class="sw"><input type="checkbox" ${x.on?'checked':''} onclick="event.stopPropagation();fl2('${x.id}')"><span></span></label></div>`).join('')}</div><div class="card" style="background:var(--bg-base)">${f?flowEd(f):'<p>Create your first flow.</p>'}</div></div>`}
function fl2(id){const f=D().flows.find(x=>x.id===id);f.on=!f.on;toast(f.name+(f.on?' is live':' paused'))}
function flowEd(f){const d=D();const btnTexts=[...new Set(d.tpls.flatMap(t=>t.btns.filter(b=>b.type==='QUICK').map(b=>b.text)))];
 const tv=f.trg.type==='button'?`<input list="bt" value="${esc(f.trg.value)}" oninput="fl().trg.value=this.value"><datalist id="bt">${btnTexts.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:f.trg.type==='keyword'?`<input value="${esc(f.trg.value)}" placeholder="e.g. hi, price" oninput="fl().trg.value=this.value">`:`<select onchange="fl().trg.value=this.value"><option value="any">Any form</option>${opts(d.forms,f.trg.value)}</select>`;
 return `<div class="row"><input style="max-width:300px;font-weight:600" value="${esc(f.name)}" oninput="fl().name=this.value"><div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="testFlow()">▶ Test on current chat</button><button class="btn del sm" onclick="delFlow()">Delete</button></div></div>
 <div class="node t"><h4>When this happens <span class="pill">Trigger</span></h4><div class="two"><select onchange="fl().trg={type:this.value,value:this.value==='form'?'any':''};render()">${[['button','Customer clicks a button'],['keyword','Customer sends a keyword'],['form','Customer submits a form']].map(([k,l])=>`<option value="${k}" ${f.trg.type===k?'selected':''}>${l}</option>`).join('')}</select>${tv}</div></div>`
 +f.steps.map((s,i)=>`<div class="cn"></div><div class="node"><h4>${STEPS[s.type]}<button class="btn del sm" onclick="fl().steps.splice(${i},1);render()">✕</button></h4>${
  s.type==='template'?`<select onchange="fl().steps[${i}].v=this.value">${opts(d.tpls.filter(t=>t.status==='APPROVED'),s.v)}</select>`:
  s.type==='form'?`<select onchange="fl().steps[${i}].v=this.value">${opts(d.forms,s.v)}</select>`:
  s.type==='assign'?`<select onchange="fl().steps[${i}].v=this.value">${AGENTS.map(a=>`<option ${a===s.v?'selected':''}>${a}</option>`).join('')}</select>`:
  s.type==='text'?`<textarea oninput="fl().steps[${i}].v=this.value">${esc(s.v)}</textarea>`:
  `<input value="${esc(s.v)}" ${s.type==='delay'?'type="number" min="1"':''} placeholder="${s.type==='delay'?'Minutes':'Tag name'}" oninput="fl().steps[${i}].v=this.value">`}</div>`).join('')
 +`<div class="cn"></div><div class="adds">${Object.entries(STEPS).map(([k,l])=>`<button class="btn ghost sm" onclick="addStep('${k}')">+ ${l}</button>`).join('')}</div>`}
function addStep(t){const d=D();fl().steps.push({type:t,v:t==='template'?d.tpls[0]?.id:t==='form'?d.forms[0]?.id:t==='assign'?AGENTS[0]:t==='delay'?'5':''});render()}
function newFlow(){const f={id:uid(),name:'Untitled flow',on:false,runs:0,trg:{type:'button',value:''},steps:[]};D().flows.push(f);S.flow=f.id;render()}
function delFlow(){D().flows=D().flows.filter(x=>x.id!==S.flow);S.flow=null;render()}
function testFlow(){const c=conv(),f=fl();if(!c)return toast('Open the inbox and simulate a customer first');if(!f.steps.length)return toast('Add at least one step');view='inbox';S.conv=c.id;render();run(f,c,cur);toast('Running “'+f.name+'” on '+c.name)}

/* ---------- settings ---------- */
function vNums(v){
 v.innerHTML=`<div class="row"><div><b>${NUMS.length} WhatsApp number${NUMS.length>1?'s':''}</b><br><small>Each number has its own inbox, templates, forms, automations and webhook.</small></div><button class="btn" onclick="addNum()">+ Add number</button></div>
 <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Number</th><th>Business account ID</th><th>Phone number ID</th><th>Status</th><th>Chats</th><th></th></tr></thead><tbody>${NUMS.map(n=>{const d=D(n.id);
 return `<tr><td><div style="display:flex;gap:10px;align-items:center"><div class="av" style="background:${n.color}">${esc(n.name[0]||'W')}</div><div><b>${esc(n.name)}</b><small style="display:block">${esc(n.phone)}</small></div></div></td><td>${esc(n.waba||'–')}</td><td>${esc(n.pid||'–')}</td><td><span class="pill ${d.cfg.ok?'ok':'wait'}">${d.cfg.ok?'Connected':'Not verified'}</span></td><td>${d.convs.length}</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" onclick="openInbox('${n.id}')">Open inbox</button> <button class="btn del sm" onclick="delNum('${n.id}')">Remove</button></td></tr>`}).join('')}</tbody></table></div>`}
function addNum(){modal(`<div class="mh"><b>Add WhatsApp number</b><button onclick="closeM()">✕</button></div><div class="mbd one"><div><label class="f">Display name</label><input id="an" placeholder="e.g. Orders Desk"><label class="f">WhatsApp phone number</label><input id="ap" placeholder="+91 98XXX XXXXX"><div class="two"><div><label class="f">Business account ID</label><input id="aw" placeholder="WABA ID"></div><div><label class="f">Phone number ID</label><input id="ai" placeholder="From Meta API setup"></div></div><label class="f">Permanent access token</label><input id="at" type="password" placeholder="EAAG…"><small style="display:block;margin-top:8px">You can change these later under API & webhooks.</small></div></div><div class="mf"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveNum()">Add number</button></div>`)}
function saveNum(){const name=$('#an').value.trim(),phone=$('#ap').value.trim(),dg=phone.replace(/\D/g,'');
 if(!name||dg.length<10)return toast('Enter a name and a valid phone number');
 if(NUMS.some(x=>x.phone.replace(/\D/g,'')===dg))return toast('This number is already added');
 const n={id:'n'+uid(),name,phone,waba:$('#aw').value.trim(),pid:$('#ai').value.trim(),color:COLORS[NUMS.length%COLORS.length]};NUMS.push(n);
 DATA[n.id]={tpls:[],forms:[],flows:[],convs:[],logs:[],cfg:{appId:'',token:$('#at').value.trim(),ver:'v21.0',vt:'wacrm_'+uid()+uid(),fields:{messages:1,message_template_status_update:1,message_deliveries:1,message_reads:1,messaging_handovers:0},ok:false}};
 closeM();render();toast(name+' added')}
function delNum(id){if(NUMS.length<2)return toast('Keep at least one number');const n=NUMS.find(x=>x.id===id),d=D(id);
 modal(`<div class="mh"><b>Remove ${esc(n.phone)}?</b><button onclick="closeM()">✕</button></div><div class="mbd one"><p>This removes “${esc(n.name)}” with its ${d.convs.length} chats, ${d.tpls.length} templates, ${d.forms.length} forms and ${d.flows.length} automations from this CRM. This can’t be undone.</p></div><div class="mf"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn del" onclick="confirmDel('${id}')">Remove number</button></div>`)}
function confirmDel(id){NUMS.splice(NUMS.findIndex(x=>x.id===id),1);delete DATA[id];LEADS=LEADS.filter(l=>l.nid!==id);if(LF.nid===id)LF.nid='all';if(cur===id){cur=NUMS[0].id;S={conv:null,flow:null}}closeM();render();toast('Number removed')}

function vSet(v){const n=N(),c=D().cfg,url=`https://crm.yourdomain.in/api/webhooks/whatsapp/${n.id}`;
 v.innerHTML=`<div class="stats"><div class="card"><small>Phone number</small><b>${n.phone}</b></div><div class="card"><small>Quality rating</small><b>High</b></div><div class="card"><small>Messaging limit</small><b>1K / 24h</b></div><div class="card"><small>Status</small><b>${c.ok?'Connected':'Not verified'}</b></div></div>
 <div class="two" style="align-items:start"><div class="card"><div class="row"><b>Meta Cloud API</b><span class="pill ok">${c.ver}</span></div>
 <label class="f">App ID</label><input value="${c.appId}" oninput="D().cfg.appId=this.value">
 <label class="f">WhatsApp Business Account ID</label><input value="${n.waba}" oninput="N().waba=this.value">
 <label class="f">Phone number ID</label><input value="${n.pid}" oninput="N().pid=this.value">
 <label class="f">Permanent access token</label><div class="br"><input id="tk" type="password" value="${c.token}" oninput="D().cfg.token=this.value"><button class="btn ghost sm" onclick="const e=$('#tk');e.type=e.type==='password'?'text':'password'">Show</button></div>
 <label class="f">Graph API version</label><select onchange="D().cfg.ver=this.value">${['v21.0','v20.0','v19.0'].map(x=>`<option ${x===c.ver?'selected':''}>${x}</option>`).join('')}</select>
 <div class="br" style="margin-top:14px"><button class="btn" onclick="D().cfg.ok=true;render();toast('Credentials verified with Meta (demo)')">Verify & save</button></div></div>
 <div class="card"><div class="row"><b>Webhook</b><span class="pill ok">Subscribed</span></div>
 <label class="f">Callback URL</label><div class="br"><input readonly value="${url}"><button class="btn ghost sm" onclick="navigator.clipboard?.writeText('${url}');toast('Copied')">Copy</button></div>
 <label class="f">Verify token</label><div class="br"><input value="${c.vt}" oninput="D().cfg.vt=this.value"><button class="btn ghost sm" onclick="D().cfg.vt='wacrm_'+uid()+uid();render()">New</button></div>
 <label class="f">Webhook fields</label>${Object.keys(c.fields).map(k=>`<label style="display:flex;gap:8px;align-items:center;margin:5px 0"><input type="checkbox" style="width:auto" ${c.fields[k]?'checked':''} onchange="D().cfg.fields['${k}']=this.checked"> ${k}</label>`).join('')}
 <div class="br" style="margin-top:12px"><button class="btn" onclick="testHook()">Send test event</button></div>
 <small style="display:block;margin-top:8px">Paste the callback URL and verify token into Meta App Dashboard → WhatsApp → Configuration.</small></div></div>
 <div class="card" style="margin-top:var(--gap)"><b>Recent webhook events</b>${D().logs.length?D().logs.map(l=>`<details><summary>${l.t} · ${l.field}</summary><pre>${esc(JSON.stringify(l.body,null,2))}</pre></details>`).join(''):'<p style="margin-top:8px">No events yet. Send a test event or chat as a customer in the Inbox.</p>'}</div>`}
function testHook(){log('messages',{contacts:[{profile:{name:'Test User'},wa_id:'919999900000'}],messages:[{from:'919999900000',type:'text',text:{body:'Webhook test'}}]});render();toast('Test event delivered (200 OK)')}
render();
</script></body></html>
